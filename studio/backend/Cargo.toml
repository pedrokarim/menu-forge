[package]
name = "studio-backend"
version = "0.1.0"
edition = "2021"
publish = false
description = "Backend local du studio Menu Forge (espace de travail, textures, bibliothèques)."
repository = "https://github.com/pedrokarim/menu-forge"
homepage = "https://pedrokarim.github.io/menu-forge/"
license = "MIT"

[lib]
name = "studio_backend"
path = "src/lib.rs"

[[bin]]
name = "studio-api"
path = "src/main.rs"

[dependencies]
# `preserve_order` : garder l’ordre des clés des documents ; `float_roundtrip` :
# lecture des nombres à virgule exacte, comme `JSON.parse`.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny_http = "0.12"
rayon = "1"
# Tri identique à `String.prototype.localeCompare` (collation Unicode d’ICU).
icu_collator = "2"
# Rich Presence Discord : client IPC en Rust pur (canal nommé `discord-ipc-0`
# sous Windows, socket Unix ailleurs), sans dépendance native.
discord-rich-presence = "1.1"
# IA : appels HTTP aux fournisseurs (bloquants, comme les fils de `tiny_http` ;
# TLS rustls en Rust pur, sans OpenSSL ni runtime asynchrone).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# IA : clés d’API dans le trousseau du système (Gestionnaire d’identifiants
# Windows, trousseau macOS, keyutils Linux), jamais dans les réglages.
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
# IA : images des fournisseurs, reçues et renvoyées à l’interface en base64.
base64 = "0.22"

[profile.release]
lto = "thin"
