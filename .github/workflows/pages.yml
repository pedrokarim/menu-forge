# Publie le site sur GitHub Pages (source : « GitHub Actions » dans Settings → Pages).
# Les pages de documentation sont générées ici depuis docs/ (site/scripts/build.py
# --docs, qui vérifie aussi tous les liens et les ancres : un lien mort bloque la
# publication). Seuls les pages et leurs ressources sont publiés : ni les scripts de
# capture ni leur package.json.
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'lib/README.md'
      - 'studio/README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; celui en cours va à son terme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer la documentation et vérifier les liens
        run: python site/scripts/build.py --docs

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Assembler le site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -r site/assets site/en site/docs _site/

      - name: Téléverser l’artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
